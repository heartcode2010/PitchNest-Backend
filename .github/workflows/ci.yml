name: VentureRoom API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, redesign/ventureroom]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Isolated placeholders only. Tests stub external providers and .invalid
      # hosts prevent CI from reaching real services.
      NODE_ENV: development
      PORT: "3000"
      JWT_SECRET: venture-room-ci-only-not-for-production-2026
      SUPABASE_URL: https://ci-placeholder.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      ALLOWED_ORIGIN: http://localhost:5174
      CLIENT_URL: http://localhost:5174
      APP_BASE_URL: http://localhost:5174
      AZURE_OPENAI_ENDPOINT: https://ci-placeholder.invalid
      AZURE_OPENAI_API_KEY: ci-placeholder
      AZURE_OPENAI_API_VERSION: 2026-07-09
      AZURE_OPENAI_DEPLOYMENT: gpt-5.6-luna
      AZURE_SPEECH_KEY: ci-placeholder
      AZURE_SPEECH_REGION: eastus
      RESEND_API_KEY: re_ci_placeholder
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      TRIAL_JOBS_ENABLED: "false"
      RESEARCH_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run application and security tests
        run: npm test

      - name: Verify database migrations
        run: npm run test:migrations
